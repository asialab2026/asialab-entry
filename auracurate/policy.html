<body class="mode-stage page-aurora" data-page="policy">
<div data-shell="header"></div>
<div data-proto-bar></div>
<main id="main">
  <div class="container jr">
    <div class="jr__crumbs"><a href="index.html">Aurora</a><span aria-hidden="true">/</span><a href="help.html">Help</a><span aria-hidden="true">/</span><span data-pol-crumb>Policies</span></div>
    <p class="eyebrow">Policies</p>
    <h1 class="jr__title" data-pol-title>Policies</h1>
    <p class="jr__lede">One set of policies for every Aurora market. What applies to a specific item — where it ships from, its return window — is on its product page.</p>
    <nav class="tabs pol-tabs" aria-label="Policies" data-pol-tabs></nav>
    <article class="sheet pol-doc" data-pol-body data-note="Draft v1.0 for founder and US counsel review. On Shopify these live at the native policy URLs (shown under the title); the theme only links to them."></article>
  </div>
</main>
<div data-shell="footer"></div>
<script src="content/content.js"></script>
<script src="content/policies.js"></script>
<script src="assets/proto.js"></script>
<script>
(function () {
  var P = window.AURORA_POLICIES, q = new URLSearchParams(location.search).get("p");
  var key = P[q] ? q : "terms", d = P[key];
  document.title = d.title + " — Aurora";
  document.querySelector("[data-pol-title]").textContent = d.title;
  document.querySelector("[data-pol-crumb]").textContent = d.title;
  document.querySelector("[data-pol-tabs]").innerHTML = P.order.map(function (k) {
    return '<a class="tab" href="policy.html?p=' + k + '"' + (k === key ? ' aria-current="page" aria-pressed="true"' : ' aria-pressed="false"') + ">" + P[k].title + "</a>";
  }).join("");
  document.querySelector("[data-pol-body]").innerHTML = '<p class="pol-url">On the store: <code>' + d.shopify + "</code></p>" + d.body;
})();
</script>
<script src="assets/aurora.js"></script>
</body>
</html>
